<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>貪食蛇 Snake</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: 'Segoe UI', sans-serif;
}
.game-container {
  background: #16213e;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
  text-align: center;
}
h1 {
  color: #e94560;
  font-size: 28px;
  margin-bottom: 15px;
  letter-spacing: 4px;
}
.score-board {
  color: #eee;
  font-size: 18px;
  margin-bottom: 15px;
  display: flex;
  justify-content: space-between;
  padding: 0 5px;
}
.score-board span { color: #f5c842; font-weight: bold; }
canvas {
  border: 2px solid #0f3460;
  border-radius: 8px;
  background: #0f3460;
  display: block;
  margin: 0 auto;
}
.controls {
  margin-top: 20px;
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.controls button {
  background: #e94560;
  color: #fff;
  border: none;
  padding: 10px 28px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.2s;
  font-weight: 600;
}
.controls button:hover { background: #d63851; }
.controls button:active { transform: scale(0.96); }
.hint {
  color: #888;
  margin-top: 12px;
  font-size: 14px;
}
@media (max-width: 500px) {
  .game-container { padding: 15px; }
  canvas { width: 300px; height: 300px; }
}
</style>
</head>
<body>
<div class="game-container">
  <h1>🐍 SNAKE</h1>
  <div class="score-board">
    <div>分數 <span id="score">0</span></div>
    <div>最高 <span id="highScore">0</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">
    <button id="restartBtn">重新開始</button>
    <button id="pauseBtn">暫停</button>
  </div>
  <div class="hint">方向鍵 ↑ ↓ ← → 控制移動</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const restartBtn = document.getElementById('restartBtn');
const pauseBtn = document.getElementById('pauseBtn');

const GRID_SIZE = 20;
const TILE_COUNT = canvas.width / GRID_SIZE;

let snake, direction, nextDirection, food, score, highScore, gameLoop, paused, gameOver;

function init() {
  snake = [
    { x: 5, y: 10 },
    { x: 4, y: 10 },
    { x: 3, y: 10 },
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  paused = false;
  gameOver = false;
  pauseBtn.textContent = '暫停';
  scoreEl.textContent = '0';
  highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
  highScoreEl.textContent = highScore;
  spawnFood();
  draw();
}

function spawnFood() {
  let pos;
  do {
    pos = {
      x: Math.floor(Math.random() * TILE_COUNT),
      y: Math.floor(Math.random() * TILE_COUNT),
    };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
}

function update() {
  if (paused || gameOver) return;

  direction = { ...nextDirection };
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y,
  };

  if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver = true;
    pauseBtn.textContent = '暫停';
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('snakeHighScore', highScore);
      highScoreEl.textContent = highScore;
    }
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    spawnFood();
  } else {
    snake.pop();
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < TILE_COUNT; i++) {
    for (let j = 0; j < TILE_COUNT; j++) {
      if ((i + j) % 2 === 0) {
        ctx.fillStyle = '#0f3460';
      } else {
        ctx.fillStyle = '#132a52';
      }
      ctx.fillRect(i * GRID_SIZE, j * GRID_SIZE, GRID_SIZE, GRID_SIZE);
    }
  }

  snake.forEach((s, i) => {
    const gradient = ctx.createRadialGradient(
      s.x * GRID_SIZE + 4, s.y * GRID_SIZE + 4, 2,
      s.x * GRID_SIZE + 10, s.y * GRID_SIZE + 10, 12
    );
    gradient.addColorStop(0, i === 0 ? '#4ecca3' : '#36b37e');
    gradient.addColorStop(1, i === 0 ? '#2d9e6f' : '#1b7a4a');
    ctx.fillStyle = gradient;
    ctx.shadowBlur = i === 0 ? 12 : 6;
    ctx.shadowColor = '#4ecca3';
    ctx.beginPath();
    ctx.roundRect(s.x * GRID_SIZE + 2, s.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4, 4);
    ctx.fill();
    ctx.shadowBlur = 0;

    if (i === 0) {
      ctx.fillStyle = '#fff';
      const eyeOff = GRID_SIZE / 2 - 3;
      const eyeX = s.x * GRID_SIZE + eyeOff;
      const eyeY = s.y * GRID_SIZE + eyeOff;
      ctx.beginPath();
      ctx.arc(eyeX + (direction.x * 2 || (direction.y === 0 ? 2 : 0)), eyeY - 2, 2, 0, Math.PI * 2);
      ctx.arc(eyeX + (direction.x * 2 || (direction.y === 0 ? 2 : 0)), eyeY + 6, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  ctx.shadowBlur = 8;
  ctx.shadowColor = '#f5c842';
  ctx.fillStyle = '#f5c842';
  ctx.beginPath();
  ctx.arc(food.x * GRID_SIZE + GRID_SIZE / 2, food.y * GRID_SIZE + GRID_SIZE / 2, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#e94560';
    ctx.font = 'bold 36px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 15);
    ctx.fillStyle = '#eee';
    ctx.font = '18px "Segoe UI", sans-serif';
    ctx.fillText('按「重新開始」再玩一次', canvas.width / 2, canvas.height / 2 + 35);
  }

  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 32px "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('暫停中', canvas.width / 2, canvas.height / 2);
  }
}

function gameStep() {
  update();
  draw();
}

function resetGame() {
  clearInterval(gameLoop);
  init();
  gameLoop = setInterval(gameStep, 120);
}

function togglePause() {
  if (gameOver) return;
  paused = !paused;
  pauseBtn.textContent = paused ? '繼續' : '暫停';
  if (!paused) draw();
}

document.addEventListener('keydown', e => {
  if (gameOver) return;
  const key = e.key;
  e.preventDefault();
  if (key === 'ArrowUp' && direction.y !== 1) nextDirection = { x: 0, y: -1 };
  else if (key === 'ArrowDown' && direction.y !== -1) nextDirection = { x: 0, y: 1 };
  else if (key === 'ArrowLeft' && direction.x !== 1) nextDirection = { x: -1, y: 0 };
  else if (key === 'ArrowRight' && direction.x !== -1) nextDirection = { x: 1, y: 0 };
  else if (key === ' ' || key === 'p' || key === 'P') togglePause();
});

restartBtn.addEventListener('click', resetGame);
pauseBtn.addEventListener('click', togglePause);

init();
gameLoop = setInterval(gameStep, 120);
</script>
</body>
</html>
